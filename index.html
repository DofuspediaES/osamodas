<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osamodas Solver - Final</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Osa Solver</h1>

        <!-- PARTE 1 -->
        <section id="part1">
            <p class="instruction">1. Lanza 4 veces cada elemento. Indica cuántos blancos salieron en total por cada uno:</p>
            <div class="grid-inputs">
                <div class="card t"><label>🪨 Tierra</label><input type="number" id="in-tierra" value="0"></div>
                <div class="card f"><label>🔥 Fuego</label><input type="number" id="in-fuego" value="0"></div>
                <div class="card w"><label>💧 Agua</label><input type="number" id="in-agua" value="0"></div>
                <div class="card a"><label>💨 Aire</label><input type="number" id="in-aire" value="0"></div>
            </div>
            <button id="btn-start">GENERAR COMBINACIONES</button>
        </section>

        <!-- PARTE 2 -->
        <section id="part2" class="hidden">
            <div id="guess-area">
                <p class="instruction">Prueba este orden en el juego:</p>
                <div id="display-guess" class="pill-container"></div>
                
                <div class="feedback-panel">
                    <p>Marca <b>TODOS</b> los círculos que veas (no importa el orden):</p>
                    <div class="circles-row">
                        <div class="circle-btn" data-state="none"></div>
                        <div class="circle-btn" data-state="none"></div>
                        <div class="circle-btn" data-state="none"></div>
                        <div class="circle-btn" data-state="none"></div>
                    </div>
                    <button id="btn-filter">FILTRAR OPCIONES</button>
                </div>
            </div>

            <div id="solution-screen" class="hidden">
                <h2 class="success-text">¡ESTA ES LA SOLUCIÓN!</h2>
                <div id="final-pills" class="pill-container"></div>
                <button class="btn-reset" onclick="location.reload()">Empezar de nuevo</button>
            </div>

            <div class="footer">
                <span>Posibilidades: <strong id="count-text">0</strong></span>
                <button class="btn-reset-small" onclick="location.reload()">Reiniciar</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
