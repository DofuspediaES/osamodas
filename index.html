<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Osamodas Mastermind Solver</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🦉 Osamodas Mastermind Solver</h1>

<p>
Introduce el resultado de tu prueba:
</p>


<div id="elementos">

<button class="fuego" onclick="añadir('F')">
🔥 Fuego
</button>

<button class="aire" onclick="añadir('A')">
🌪 Aire
</button>

<button class="agua" onclick="añadir('W')">
💧 Agua
</button>

<button class="tierra" onclick="añadir('T')">
🌍 Tierra
</button>

</div>


<h2>Combinación probada:</h2>

<div id="prueba"></div>


<h2>Resultado:</h2>


<label>
⚪ Blancos:
<input id="blancos" type="number" min="0" max="4">
</label>


<label>
⚫ Negros:
<input id="negros" type="number" min="0" max="4">
</label>


<br><br>

<button onclick="guardarResultado()">
Confirmar resultado
</button>


<h2>Siguiente combinación:</h2>

<div id="respuesta"></div>


<script src="script.js"></script>

</body>
</html>
