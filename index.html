<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecanica de Invocación de Osamodas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Mecanica de Invocación de Osamodas</h1>
            <!-- Imagen del monstruo. Puedes cambiar el 'src' por una URL local si descargas la imagen -->
            <div class="monster-container">
                <img src="https://api.dofusdb.fr/img/monsters/4977.png" alt="Invocación de Osamodas" class="monster-img">
            </div>
        </header>

        <!-- PARTE 1 -->
        <section id="part1">
            <p class="instruction">Paso 1: Lanza 4 veces cada hechizo y anota los blancos totales:</p>
            <div class="grid-elements">
                <div class="card-element tierra">
                    <label>TIERRA</label>
                    <input type="number" id="in-tierra" value="0" min="0" max="4">
                </div>
                <div class="card-element fuego">
                    <label>FUEGO</label>
                    <input type="number" id="in-fuego" value="0" min="0" max="4">
                </div>
                <div class="card-element agua">
                    <label>AGUA</label>
                    <input type="number" id="in-agua" value="0" min="0" max="4">
                </div>
                <div class="card-element aire">
                    <label>AIRE</label>
                    <input type="number" id="in-aire" value="0" min="0" max="4">
                </div>
            </div>
            <button id="btn-start" class="btn-main">GENERAR POSIBILIDADES</button>
        </section>

        <!-- PARTE 2 -->
        <section id="part2" class="hidden">
            <p class="instruction">Paso 2: Lanza este orden y marca los círculos exactos:</p>
            <div id="solver-grid"></div>
            <button id="btn-filter" class="btn-main">FILTRAR PATRÓN</button>

            <div id="msg-warning" class="warning-panel hidden">
                ⚠️ Error detectado. Buscando solución entre todas las combinaciones...
            </div>

            <div id="solution-view" class="hidden">
                <h2 class="success-text">¡SOLUCIÓN FINAL!</h2>
                <div id="final-pills" class="pill-container"></div>
                <p class="instruction">Lanza estos elementos para ganar.</p>
            </div>

            <div class="footer">
                <span>Posibilidades: <strong id="count-text">0</strong></span>
                <button class="btn-reset" onclick="location.reload()">REINICIAR</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
