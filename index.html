<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osamodas Solver - Final Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Osa Solver</h1>

        <section id="part1">
            <p class="instruction">1. Pon las cantidades del Paso 1 (Suma 4):</p>
            <div class="grid-inputs">
                <div class="card t"><label>🪨 Tierra</label><input type="number" id="in-tierra" value="0"></div>
                <div class="card f"><label>🔥 Fuego</label><input type="number" id="in-fuego" value="0"></div>
                <div class="card w"><label>💧 Agua</label><input type="number" id="in-agua" value="0"></div>
                <div class="card a"><label>💨 Aire</label><input type="number" id="in-aire" value="0"></div>
            </div>
            <button id="btn-start">GENERAR</button>
        </section>

        <section id="part2" class="hidden">
            <div id="solver-view">
                <p class="instruction">Prueba este orden y marca los círculos:</p>
                <div id="solver-grid"></div>
                <button id="btn-filter">FILTRAR PATRÓN</button>
                
                <div class="debug-area">
                    <p>Opciones restantes:</p>
                    <div id="possible-list"></div>
                </div>
            </div>

            <div id="solution-view" class="hidden">
                <h2 class="success-text">¡SOLUCIÓN!</h2>
                <div id="final-pills" class="pill-container"></div>
                <button onclick="location.reload()" class="btn-reset">Reiniciar</button>
            </div>

            <div class="footer">
                <span>Restantes: <strong id="count-text">0</strong></span>
                <button class="btn-reset-small" onclick="location.reload()">Reset</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
