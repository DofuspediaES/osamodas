<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osamodas Solver - Estable</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Osa Solver</h1>

        <!-- PARTE 1 -->
        <section id="part1">
            <p class="instruction">1. Lanza 4 veces cada hechizo y anota cuántos círculos salen en total (solo cuentan los que aparecen):</p>
            <div class="grid-inputs">
                <div class="card t"><label>🪨 Tierra</label><input type="number" id="in-tierra" value="0" min="0" max="4"></div>
                <div class="card f"><label>🔥 Fuego</label><input type="number" id="in-fuego" value="0" min="0" max="4"></div>
                <div class="card w"><label>💧 Agua</label><input type="number" id="in-agua" value="0" min="0" max="4"></div>
                <div class="card a"><label>💨 Aire</label><input type="number" id="in-aire" value="0" min="0" max="4"></div>
            </div>
            <button id="btn-start">GENERAR COMBINACIONES</button>
        </section>

        <!-- PARTE 2 -->
        <section id="part2" class="hidden">
            <div id="guess-container">
                <p>Prueba esta combinación en el juego:</p>
                <div id="display-guess" class="pill-container"></div>
                
                <div class="feedback-section">
                    <p>Haz clic en los círculos para marcar lo que salió:</p>
                    <div class="circles-row">
                        <div class="circle" data-state="none"></div>
                        <div class="circle" data-state="none"></div>
                        <div class="circle" data-state="none"></div>
                        <div class="circle" data-state="none"></div>
                    </div>
                    <button id="btn-filter">FILTRAR OPCIONES</button>
                </div>
            </div>

            <div id="solution-area" class="hidden">
                <h2 class="success">¡SOLUCIÓN ENCONTRADA!</h2>
                <div id="final-guess" class="pill-container"></div>
            </div>

            <div class="footer">
                <span>Posibilidades: <strong id="count-text">0</strong></span>
                <button class="btn-reset" onclick="location.reload()">Reiniciar</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
