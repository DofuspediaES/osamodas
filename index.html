<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osamodas Mastermind Posicional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Osa Mastermind</h1>

        <!-- PARTE 1 -->
        <section id="part1">
            <p class="instruction">1. Lanza 4 veces cada hechizo y anota cuántos círculos blancos salen por cada uno:</p>
            <div class="grid-inputs">
                <div class="card t"><label>🪨 Tierra</label><input type="number" id="in-tierra" value="0" min="0" max="4"></div>
                <div class="card f"><label>🔥 Fuego</label><input type="number" id="in-fuego" value="0" min="0" max="4"></div>
                <div class="card w"><label>💧 Agua</label><input type="number" id="in-agua" value="0" min="0" max="4"></div>
                <div class="card a"><label>💨 Aire</label><input type="number" id="in-aire" value="0" min="0" max="4"></div>
            </div>
            <button id="btn-start">GENERAR</button>
        </section>

        <!-- PARTE 2 -->
        <section id="part2" class="hidden">
            <p>Prueba esta combinación y haz clic en cada círculo para cambiar su color según lo que veas en el juego:</p>
            
            <div id="solver-ui">
                <div class="slot-container" id="slot-0">
                    <div class="pill">Tierra</div>
                    <div class="circle-btn" data-state="none"></div>
                </div>
                <div class="slot-container" id="slot-1">
                    <div class="pill">Agua</div>
                    <div class="circle-btn" data-state="none"></div>
                </div>
                <div class="slot-container" id="slot-2">
                    <div class="pill">Agua</div>
                    <div class="circle-btn" data-state="none"></div>
                </div>
                <div class="slot-container" id="slot-3">
                    <div class="pill">Aire</div>
                    <div class="circle-btn" data-state="none"></div>
                </div>
            </div>

            <button id="btn-filter" style="margin-top: 20px;">FILTRAR CON ESTE RESULTADO</button>

            <div class="info-bar">
                <span>Posibles: <strong id="count-text">0</strong></span>
                <button class="btn-reset" onclick="location.reload()">Reiniciar</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
