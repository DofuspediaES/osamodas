<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osamodas Mastermind Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Osa Mastermind</h1>

        <!-- PARTE 1 -->
        <section id="part1">
            <p class="instruction">1. Lanza 4 veces cada hechizo e indica cuántos círculos blancos salen:</p>
            <div class="grid-inputs">
                <div class="card t"><label>🪨 Tierra</label><input type="number" id="in-tierra" value="0" min="0" max="4"></div>
                <div class="card f"><label>🔥 Fuego</label><input type="number" id="in-fuego" value="0" min="0" max="4"></div>
                <div class="card w"><label>💧 Agua</label><input type="number" id="in-agua" value="0" min="0" max="4"></div>
                <div class="card a"><label>💨 Aire</label><input type="number" id="in-aire" value="0" min="0" max="4"></div>
            </div>
            <div id="error-msg" class="error"></div>
            <button id="btn-start">GENERAR POSIBILIDADES</button>
        </section>

        <!-- PARTE 2 -->
        <section id="part2" class="hidden">
            <p class="instruction">2. Prueba este orden y marca los círculos tal cual aparecen en el juego:</p>
            
            <div id="solver-grid">
                <div class="slot" id="slot-0">
                    <div class="pill">...</div>
                    <div class="circle-btn" data-state="none"></div>
                </div>
                <div class="slot" id="slot-1">
                    <div class="pill">...</div>
                    <div class="circle-btn" data-state="none"></div>
                </div>
                <div class="slot" id="slot-2">
                    <div class="pill">...</div>
                    <div class="circle-btn" data-state="none"></div>
                </div>
                <div class="slot" id="slot-3">
                    <div class="pill">...</div>
                    <div class="circle-btn" data-state="none"></div>
                </div>
            </div>

            <button id="btn-filter">FILTRAR RESULTADOS</button>

            <div id="success-msg" class="hidden">
                <h2 style="color: #00ff00;">¡SOLUCIÓN ENCONTRADA!</h2>
            </div>

            <div class="footer">
                <span>Posibilidades: <strong id="count-text">0</strong></span>
                <button class="btn-reset" onclick="location.reload()">Reiniciar</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
