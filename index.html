<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osa Mastermind Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Osa Mastermind</h1>

        <!-- PARTE 1: DETERMINAR CANTIDADES -->
        <section id="part1">
            <p class="instruction">Lanza 4 veces cada elemento. Indica cuántos círculos blancos salen por cada uno:</p>
            <div class="grid-inputs">
                <div class="card terra">
                    <label>🪨 Tierra</label>
                    <input type="number" id="in-tierra" value="0" min="0" max="4">
                </div>
                <div class="card fuego">
                    <label>🔥 Fuego</label>
                    <input type="number" id="in-fuego" value="0" min="0" max="4">
                </div>
                <div class="card agua">
                    <label>💧 Agua</label>
                    <input type="number" id="in-agua" value="0" min="0" max="4">
                </div>
                <div class="card aire">
                    <label>💨 Aire</label>
                    <input type="number" id="in-aire" value="0" min="0" max="4">
                </div>
            </div>
            <p id="error-msg" class="error"></p>
            <button id="btn-start">GENERAR COMBINACIONES</button>
        </section>

        <!-- PARTE 2: RESOLVER SECUENCIA -->
        <section id="part2" class="hidden">
            <div class="guess-section">
                <p>Prueba esta combinación:</p>
                <div id="display-guess" class="pill-container"></div>
                
                <div class="feedback-box">
                    <p>Introduce los resultados:</p>
                    <div class="feedback-inputs">
                        <div class="f-field">
                            <label>⚪ Blancos</label>
                            <input type="number" id="res-white" value="0" min="0" max="4">
                        </div>
                        <div class="f-field">
                            <label>⚫ Negros</label>
                            <input type="number" id="res-black" value="0" min="0" max="4">
                        </div>
                    </div>
                    <button id="btn-filter">FILTRAR OPCIONES</button>
                </div>
            </div>

            <div class="info-bar">
                <span>Posibles: <strong id="count-text">0</strong></span>
                <button class="btn-reset" onclick="location.reload()">Reiniciar</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
