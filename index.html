<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osa Mastermind - Lógica Estricta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Osa Solver</h1>
        
        <!-- PARTE 1 -->
        <section id="part1">
            <p class="instruction">1. Indica cuántos hay de cada uno (Suma total 4):</p>
            <div class="grid-inputs">
                <div class="card t"><label>🪨 Tierra</label><input type="number" id="in-tierra" value="0"></div>
                <div class="card f"><label>🔥 Fuego</label><input type="number" id="in-fuego" value="0"></div>
                <div class="card w"><label>💧 Agua</label><input type="number" id="in-agua" value="0"></div>
                <div class="card a"><label>💨 Aire</label><input type="number" id="in-aire" value="0"></div>
            </div>
            <button id="btn-start">GENERAR PERMUTACIONES</button>
        </section>

        <!-- PARTE 2 -->
        <section id="part2" class="hidden">
            <p class="instruction">2. Lanza este orden y marca los círculos:</p>
            <div id="solver-grid"></div>
            <button id="btn-filter">FILTRAR</button>

            <div id="solution-view" class="hidden">
                <h2 style="color: #00ff00;">¡ESTA ES LA SOLUCIÓN!</h2>
                <div id="final-pills" class="pill-container"></div>
            </div>

            <div class="footer">
                <span>Combinaciones posibles: <strong id="count-text">0</strong></span>
                <button class="btn-reset" onclick="location.reload()">Reiniciar</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
