<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osamodas Solver - Modo Experto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Osa Mastermind Pro</h1>

        <!-- PARTE 1 -->
        <section id="part1">
            <p class="instruction">1. Indica cuántos círculos salieron al lanzar 4 veces cada hechizo:</p>
            <div class="grid-inputs">
                <div class="card t"><label>🪨 Tierra</label><input type="number" id="in-tierra" value="0"></div>
                <div class="card f"><label>🔥 Fuego</label><input type="number" id="in-fuego" value="0"></div>
                <div class="card w"><label>💧 Agua</label><input type="number" id="in-agua" value="0"></div>
                <div class="card a"><label>💨 Aire</label><input type="number" id="in-aire" value="0"></div>
            </div>
            <button id="btn-start">GENERAR</button>
        </section>

        <!-- PARTE 2 -->
        <section id="part2" class="hidden">
            <div id="solver-view">
                <p class="instruction">Prueba este orden en el juego:</p>
                <div id="guess-display" class="pill-container"></div>
                
                <div class="feedback-panel">
                    <p>Marca cuántos círculos de cada color salieron:</p>
                    <div class="circles-row">
                        <div class="circle-btn" data-state="none" id="c1"></div>
                        <div class="circle-btn" data-state="none" id="c2"></div>
                        <div class="circle-btn" data-state="none" id="c3"></div>
                        <div class="circle-btn" data-state="none" id="c4"></div>
                    </div>
                    <button id="btn-filter">FILTRAR RESULTADO</button>
                </div>
            </div>

            <!-- SOLUCIÓN FINAL -->
            <div id="solution-view" class="hidden">
                <h2 class="success-text">¡SOLUCIÓN!</h2>
                <div id="final-pills" class="pill-container"></div>
                <button onclick="location.reload()" class="btn-reset">Reiniciar</button>
            </div>

            <div class="footer">
                <span>Posibilidades: <strong id="count-text">0</strong></span>
                <button class="btn-reset-small" onclick="location.reload()">Reset</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
