<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solucionador de Osamodas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #2a2a2a;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            padding: 25px;
            border: 2px solid #444;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2em;
            color: #fff;
            margin-bottom: 5px;
        }

        .header p {
            color: #aaa;
            font-size: 0.9em;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.1em;
            color: #fff;
            margin-bottom: 12px;
            font-weight: bold;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        .elements-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .slot {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slot-label {
            font-size: 0.85em;
            color: #aaa;
            text-align: center;
        }

        .element-btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .element-btn.aire {
            background: #2ecc71;
            color: #fff;
        }

        .element-btn.tierra {
            background: #8B6914;
            color: #fff;
        }

        .element-btn.fuego {
            background: #e74c3c;
            color: #fff;
        }

        .element-btn.agua {
            background: #3498db;
            color: #fff;
        }

        .element-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .element-btn.selected {
            box-shadow: 0 0 15px currentColor;
            border: 2px solid #fff;
        }

        .selected-display {
            background: #1a1a1a;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .selected-item {
            background: #3a3a3a;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            color: #aaa;
            font-size: 0.9em;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #555;
        }

        .selected-item.aire {
            background: #2ecc71;
            color: #fff;
            border-color: #27ae60;
        }

        .selected-item.tierra {
            background: #8B6914;
            color: #fff;
            border-color: #6b5010;
        }

        .selected-item.fuego {
            background: #e74c3c;
            color: #fff;
            border-color: #c0392b;
        }

        .selected-item.agua {
            background: #3498db;
            color: #fff;
            border-color: #2980b9;
        }

        .feedback-input {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .feedback-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .feedback-group label {
            color: #fff;
            font-weight: bold;
            font-size: 0.9em;
        }

        .feedback-group input {
            padding: 10px;
            border: 2px solid #555;
            border-radius: 6px;
            font-size: 1em;
            background: #3a3a3a;
            color: #fff;
            text-align: center;
            transition: border-color 0.3s;
        }

        .feedback-group input:focus {
            outline: none;
            border-color: #3498db;
            background: #444;
        }

        .circle-preview {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 30px;
            align-items: center;
            margin-top: 8px;
        }

        .circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #555;
        }

        .circle.white {
            background: #fff;
            border-color: #fff;
        }

        .circle.black {
            background: #333;
            border-color: #666;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-send {
            background: #3498db;
            color: white;
        }

        .btn-send:hover:not(:disabled) {
            background: #2980b9;
        }

        .btn-send:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-reset {
            background: #e74c3c;
            color: white;
        }

        .btn-reset:hover {
            background: #c0392b;
        }

        .btn-clear {
            background: #555;
            color: #fff;
            padding: 8px;
        }

        .btn-clear:hover {
            background: #666;
        }

        .history {
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 12px;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-item {
            padding: 8px;
            margin-bottom: 6px;
            background: #3a3a3a;
            border-left: 3px solid #3498db;
            border-radius: 4px;
            font-size: 0.9em;
            color: #fff;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-empty {
            color: #666;
            text-align: center;
            font-size: 0.9em;
        }

        .status-message {
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 12px;
            display: none;
            font-size: 0.95em;
        }

        .status-message.success {
            background: #27ae60;
            color: #fff;
            display: block;
        }

        .status-message.error {
            background: #e74c3c;
            color: #fff;
            display: block;
        }

        .status-message.info {
            background: #3498db;
            color: #fff;
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9em;
            color: #aaa;
            text-align: center;
            margin-bottom: 15px;
        }

        .stat-item {
            background: #3a3a3a;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #555;
        }

        .stat-value {
            color: #3498db;
            font-weight: bold;
            font-size: 1.1em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.6em;
            }

            .elements-selector {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧩 Osamodas</h1>
            <p>Solucionador de Códigos</p>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <!-- PASO 1: SELECCIONAR ELEMENTOS -->
        <div class="section">
            <div class="section-title">1️⃣ Selecciona los 4 Elementos</div>
            
            <div class="elements-selector">
                <div class="slot">
                    <div class="slot-label">Posición 1</div>
                    <button class="element-btn aire" onclick="selectElement(0, 'aire')">🌪️ Aire</button>
                    <button class="element-btn tierra" onclick="selectElement(0, 'tierra')">🌍 Tierra</button>
                </div>
                <div class="slot">
                    <div class="slot-label">Posición 2</div>
                    <button class="element-btn fuego" onclick="selectElement(1, 'fuego')">🔥 Fuego</button>
                    <button class="element-btn agua" onclick="selectElement(1, 'agua')">💧 Agua</button>
                </div>
                <div class="slot">
                    <div class="slot-label">Posición 3</div>
                    <button class="element-btn aire" onclick="selectElement(2, 'aire')">🌪️ Aire</button>
                    <button class="element-btn tierra" onclick="selectElement(2, 'tierra')">🌍 Tierra</button>
                </div>
                <div class="slot">
                    <div class="slot-label">Posición 4</div>
                    <button class="element-btn fuego" onclick="selectElement(3, 'fuego')">🔥 Fuego</button>
                    <button class="element-btn agua" onclick="selectElement(3, 'agua')">💧 Agua</button>
                </div>
            </div>

            <div class="selected-display" id="selectedDisplay">
                <div class="selected-item">-</div>
                <div class="selected-item">-</div>
                <div class="selected-item">-</div>
                <div class="selected-item">-</div>
            </div>
        </div>

        <!-- PASO 2: INGRESAR FEEDBACK -->
        <div class="section">
            <div class="section-title">2️⃣ Resultado del Juego</div>
            
            <div class="feedback-input">
                <div class="feedback-group">
                    <label for="whiteCircles">⚪ Blancos</label>
                    <input type="number" id="whiteCircles" min="0" max="4" value="0" onchange="updatePreview()">
                </div>
                <div class="feedback-group">
                    <label for="blackCircles">⚫ Negros</label>
                    <input type="number" id="blackCircles" min="0" max="4" value="0" onchange="updatePreview()">
                </div>
            </div>

            <div class="circle-preview" id="circlePreview"></div>

            <div class="button-group">
                <button class="btn-send" onclick="submitAttempt()">✓ Enviar</button>
                <button class="btn-clear" onclick="clearSelection()">Limpiar</button>
            </div>
        </div>

        <!-- ESTADÍSTICAS -->
        <div class="stats">
            <div class="stat-item">
                Intentos: <span class="stat-value" id="attemptCount">0</span>
            </div>
            <div class="stat-item">
                Posibles: <span class="stat-value" id="combinationCount">256</span>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="section">
            <div class="section-title">📊 Historial</div>
            <div class="history" id="historyContainer">
                <div class="history-empty">Sin intentos aún</div>
            </div>
        </div>

        <button class="btn-reset" onclick="resetSolver()" style="width: 100%;">🔄 Reiniciar Todo</button>
    </div>

    <script>
        const ELEMENTS = ['Aire', 'Tierra', 'Fuego', 'Agua'];
        const ELEMENT_NAMES = {
            'aire': 'Aire',
            'tierra': 'Tierra',
            'fuego': 'Fuego',
            'agua': 'Agua'
        };

        let solver = {
            possibleCombinations: generateAllCombinations(),
            attempts: [],
            feedbackHistory: [],
            currentSelection: [null, null, null, null]
        };

        function generateAllCombinations() {
            const combinations = [];
            for (let i = 0; i < Math.pow(ELEMENTS.length, 4); i++) {
                const combo = [];
                let num = i;
                for (let j = 0; j < 4; j++) {
                    combo.push(ELEMENTS[num % ELEMENTS.length]);
                    num = Math.floor(num / ELEMENTS.length);
                }
                combinations.push(combo);
            }
            return combinations;
        }

        function selectElement(position, element) {
            solver.currentSelection[position] = ELEMENT_NAMES[element];
            updateDisplay();
        }

        function updateDisplay() {
            const display = document.getElementById('selectedDisplay');
            display.innerHTML = '';
            
            solver.currentSelection.forEach((element, index) => {
                const div = document.createElement('div');
                div.className = 'selected-item';
                
                if (element) {
                    div.textContent = element.substring(0, 4);
                    div.classList.add(element.toLowerCase());
                } else {
                    div.textContent = '-';
                }
                
                display.appendChild(div);
            });
        }

        function updatePreview() {
            const white = parseInt(document.getElementById('whiteCircles').value) || 0;
            const black = parseInt(document.getElementById('blackCircles').value) || 0;
            
            const preview = document.getElementById('circlePreview');
            preview.innerHTML = '';
            
            for (let i = 0; i < white; i++) {
                const circle = document.createElement('div');
                circle.className = 'circle white';
                preview.appendChild(circle);
            }
            
            for (let i = 0; i < black; i++) {
                const circle = document.createElement('div');
                circle.className = 'circle black';
                preview.appendChild(circle);
            }
        }

        function clearSelection() {
            solver.currentSelection = [null, null, null, null];
            document.getElementById('whiteCircles').value = 0;
            document.getElementById('blackCircles').value = 0;
            updateDisplay();
            updatePreview();
        }

        function calculateFeedback(guess, secret) {
            let whiteCircles = 0;
            let blackCircles = 0;

            const secretRemaining = [];
            const guessRemaining = [];

            for (let i = 0; i < guess.length; i++) {
                if (guess[i] === secret[i]) {
                    whiteCircles++;
                } else {
                    secretRemaining.push(secret[i]);
                    guessRemaining.push(guess[i]);
                }
            }

            for (let element of guessRemaining) {
                const index = secretRemaining.indexOf(element);
                if (index !== -1) {
                    blackCircles++;
                    secretRemaining.splice(index, 1);
                }
            }

            return { white: whiteCircles, black: blackCircles };
        }

        function submitAttempt() {
            // Validar selección
            if (solver.currentSelection.includes(null)) {
                showStatus('Selecciona los 4 elementos', 'error');
                return;
            }

            const white = parseInt(document.getElementById('whiteCircles').value);
            const black = parseInt(document.getElementById('blackCircles').value);

            if (isNaN(white) || isNaN(black) || white < 0 || black < 0 || white + black > 4) {
                showStatus('Feedback inválido', 'error');
                return;
            }

            // Guardar intento
            solver.attempts.push([...solver.currentSelection]);
            solver.feedbackHistory.push({ white, black });

            // Verificar si ganó
            if (white === 4) {
                addToHistory(solver.currentSelection, white, black, true);
                showStatus(`🎉 ¡CÓDIGO ENCONTRADO!`, 'success');
                return;
            }

            // Filtrar combinaciones posibles
            const newPossible = [];
            for (let combo of solver.possibleCombinations) {
                const feedback = calculateFeedback(solver.currentSelection, combo);
                if (feedback.white === white && feedback.black === black) {
                    newPossible.push(combo);
                }
            }

            solver.possibleCombinations = newPossible;

            if (solver.possibleCombinations.length === 0) {
                showStatus('❌ Error en el feedback', 'error');
            } else {
                addToHistory(solver.currentSelection, white, black);
                showStatus(`✓ Intento guardado - ${solver.possibleCombinations.length} posibilidades`, 'success');
                
                // Limpiar y mostrar siguiente sugerencia
                clearSelection();
                suggestNext();
            }

            updateStats();
        }

        function suggestNext() {
            let suggestedCombo = solver.possibleCombinations[0];
            
            if (solver.attempts.length === 0) {
                suggestedCombo = ['Aire', 'Aire', 'Tierra', 'Tierra'];
            }

            // Auto-seleccionar
            suggestedCombo.forEach((element, index) => {
                solver.currentSelection[index] = element;
            });
            updateDisplay();
            showStatus(`Siguiente sugerencia: ${suggestedCombo.join(' → ')}`, 'info');
        }

        function addToHistory(combo, white, black, isWin = false) {
            const container = document.getElementById('historyContainer');
            
            if (container.querySelector('.history-empty')) {
                container.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<strong>#${solver.attempts.length}:</strong> ${combo.join(' → ')} | ⚪${white} ⚫${black}${isWin ? ' ✓' : ''}`;
            container.appendChild(item);
            container.scrollTop = container.scrollHeight;
        }

        function updateStats() {
            document.getElementById('attemptCount').textContent = solver.attempts.length;
            document.getElementById('combinationCount').textContent = solver.possibleCombinations.length;
        }

        function showStatus(message, type) {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.className = `status-message ${type}`;
            setTimeout(() => {
                status.className = 'status-message';
            }, 4000);
        }

        function resetSolver() {
            solver = {
                possibleCombinations: generateAllCombinations(),
                attempts: [],
                feedbackHistory: [],
                currentSelection: [null, null, null, null]
            };

            document.getElementById('historyContainer').innerHTML = '<div class="history-empty">Sin intentos aún</div>';
            document.getElementById('whiteCircles').value = 0;
            document.getElementById('blackCircles').value = 0;
            updateDisplay();
            updatePreview();
            updateStats();
            showStatus('✓ Reiniciado', 'info');
        }

        // Inicializar
        window.addEventListener('load', () => {
            updateDisplay();
            updateStats();
            showStatus('Selecciona 4 elementos para comenzar', 'info');
        });
    </script>
</body>
</html>
