<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invocación de Osamodas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background: #2a2a2a;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
            padding: 20px;
            border: 2px solid #444;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header img {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 2px solid #3498db;
        }

        .header h1 {
            font-size: 1.6em;
            color: #fff;
            margin-bottom: 3px;
        }

        .header p {
            color: #aaa;
            font-size: 0.85em;
        }

        .status-message {
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 12px;
            display: none;
            font-size: 0.9em;
        }

        .status-message.success {
            background: #27ae60;
            color: #fff;
            display: block;
        }

        .status-message.error {
            background: #e74c3c;
            color: #fff;
            display: block;
        }

        .status-message.info {
            background: #3498db;
            color: #fff;
            display: block;
        }

        .section {
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 0.95em;
            color: #fff;
            margin-bottom: 8px;
            font-weight: bold;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        /* SUGERENCIA */
        .suggestion-box {
            background: #1a1a1a;
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            text-align: center;
        }

        .suggestion-text {
            color: #aaa;
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        .suggestion-combo {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .suggestion-item {
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            font-size: 0.9em;
            border: 2px solid transparent;
        }

        .suggestion-item.aire {
            background: #2ecc71;
        }

        .suggestion-item.tierra {
            background: #8B6914;
        }

        .suggestion-item.fuego {
            background: #e74c3c;
        }

        .suggestion-item.agua {
            background: #3498db;
        }

        /* SELECTOR DE ELEMENTOS */
        .elements-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .position-slot {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .position-label {
            font-size: 0.75em;
            color: #999;
            text-align: center;
        }

        .element-selector {
            background: #3a3a3a;
            border: 2px solid #555;
            border-radius: 6px;
            padding: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 0.9em;
            transition: all 0.2s;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .element-selector:hover {
            border-color: #3498db;
            background: #444;
        }

        .element-selector.aire {
            background: #2ecc71;
            color: #fff;
            border-color: #27ae60;
        }

        .element-selector.tierra {
            background: #8B6914;
            color: #fff;
            border-color: #6b5010;
        }

        .element-selector.fuego {
            background: #e74c3c;
            color: #fff;
            border-color: #c0392b;
        }

        .element-selector.agua {
            background: #3498db;
            color: #fff;
            border-color: #2980b9;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            background: #3a3a3a;
            border: 2px solid #3498db;
            border-radius: 6px;
            z-index: 1000;
            min-width: 120px;
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-item {
            padding: 8px 12px;
            color: #fff;
            cursor: pointer;
            border-bottom: 1px solid #555;
            transition: background 0.2s;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: #444;
        }

        .dropdown-item.aire { color: #2ecc71; font-weight: bold; }
        .dropdown-item.tierra { color: #8B6914; font-weight: bold; }
        .dropdown-item.fuego { color: #e74c3c; font-weight: bold; }
        .dropdown-item.agua { color: #3498db; font-weight: bold; }

        /* FEEDBACK CIRCLES */
        .feedback-circles {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .circle-slot {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .circle-slot-label {
            font-size: 0.7em;
            color: #999;
        }

        .circle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #555;
            background: #3a3a3a;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .circle-btn:hover {
            transform: scale(1.1);
        }

        .circle-btn.white {
            background: #fff;
            border-color: #fff;
            color: #000;
        }

        .circle-btn.black {
            background: #333;
            border-color: #666;
        }

        .circle-btn.empty {
            background: #3a3a3a;
            border-color: #555;
        }

        /* BOTONES */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-confirm {
            background: #27ae60;
            color: white;
            grid-column: span 2;
        }

        .btn-confirm:hover {
            background: #229954;
        }

        .btn-reset {
            background: #e74c3c;
            color: white;
        }

        .btn-reset:hover {
            background: #c0392b;
        }

        .btn-skip {
            background: #3498db;
            color: white;
        }

        .btn-skip:hover {
            background: #2980b9;
        }

        /* HISTORIAL */
        .history {
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.85em;
        }

        .history-item {
            padding: 6px;
            margin-bottom: 4px;
            background: #3a3a3a;
            border-left: 3px solid #3498db;
            border-radius: 3px;
            color: #fff;
        }

        .history-empty {
            color: #666;
            text-align: center;
            padding: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85em;
            color: #aaa;
            text-align: center;
            margin-bottom: 12px;
        }

        .stat-item {
            background: #3a3a3a;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #555;
        }

        .stat-value {
            color: #3498db;
            font-weight: bold;
            font-size: 1.2em;
        }

        @media (max-width: 500px) {
            .container {
                padding: 15px;
            }

            .header img {
                width: 60px;
                height: 60px;
            }

            .header h1 {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://dofuspedia.fandom.com/es/wiki/Archivo:Invocaci%C3%B3n_de_Osamodas.png" alt="Invocación de Osamodas" onerror="this.style.display='none'">
            <h1>Invocación de Osamodas</h1>
            <p>Solucionador de Códigos</p>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <!-- SUGERENCIA -->
        <div class="suggestion-box">
            <div class="suggestion-text">📍 Intenta esta combinación:</div>
            <div class="suggestion-combo" id="suggestionCombo">
                <div class="suggestion-item aire">Aire</div>
                <div class="suggestion-item tierra">Tierra</div>
                <div class="suggestion-item fuego">Fuego</div>
                <div class="suggestion-item agua">Agua</div>
            </div>
        </div>

        <!-- SELECTOR DE ELEMENTOS -->
        <div class="section">
            <div class="section-title">Tu Combinación</div>
            <div class="elements-row" id="elementsRow">
                <div class="position-slot">
                    <div class="position-label">Pos 1</div>
                    <div class="element-selector" onclick="toggleDropdown(0)">-</div>
                </div>
                <div class="position-slot">
                    <div class="position-label">Pos 2</div>
                    <div class="element-selector" onclick="toggleDropdown(1)">-</div>
                </div>
                <div class="position-slot">
                    <div class="position-label">Pos 3</div>
                    <div class="element-selector" onclick="toggleDropdown(2)">-</div>
                </div>
                <div class="position-slot">
                    <div class="position-label">Pos 4</div>
                    <div class="element-selector" onclick="toggleDropdown(3)">-</div>
                </div>
            </div>
        </div>

        <!-- FEEDBACK CIRCLES -->
        <div class="section">
            <div class="section-title">Resultado del Juego</div>
            <div class="feedback-circles" id="feedbackCircles">
                <div class="circle-slot">
                    <div class="circle-slot-label">Pos 1</div>
                    <div class="circle-btn empty" onclick="cycleCircle(0)"></div>
                </div>
                <div class="circle-slot">
                    <div class="circle-slot-label">Pos 2</div>
                    <div class="circle-btn empty" onclick="cycleCircle(1)"></div>
                </div>
                <div class="circle-slot">
                    <div class="circle-slot-label">Pos 3</div>
                    <div class="circle-btn empty" onclick="cycleCircle(2)"></div>
                </div>
                <div class="circle-slot">
                    <div class="circle-slot-label">Pos 4</div>
                    <div class="circle-btn empty" onclick="cycleCircle(3)"></div>
                </div>
            </div>
        </div>

        <!-- ESTADÍSTICAS -->
        <div class="stats">
            <div class="stat-item">Intentos: <span class="stat-value" id="attemptCount">0</span></div>
            <div class="stat-item">Posibles: <span class="stat-value" id="combinationCount">256</span></div>
        </div>

        <!-- BOTONES -->
        <div class="button-group">
            <button class="btn-skip" onclick="useSuggestion()">📋 Usar Sugerencia</button>
            <button class="btn-reset" onclick="resetSolver()">🔄 Reiniciar</button>
        </div>

        <button class="btn-confirm" onclick="submitFeedback()">✓ Confirmar Resultado</button>

        <!-- HISTORIAL -->
        <div class="section">
            <div class="section-title">📊 Historial</div>
            <div class="history" id="history">
                <div class="history-empty">Sin intentos aún</div>
            </div>
        </div>
    </div>

    <script>
        const ELEMENTS = ['Aire', 'Tierra', 'Fuego', 'Agua'];
        const ELEMENT_CLASS = {
            'Aire': 'aire',
            'Tierra': 'tierra',
            'Fuego': 'fuego',
            'Agua': 'agua'
        };

        let solver = {
            possibleCombinations: generateAllCombinations(),
            attempts: [],
            feedbackHistory: [],
            currentSelection: [null, null, null, null],
            currentFeedback: ['empty', 'empty', 'empty', 'empty'],
            currentSuggestion: ['Aire', 'Aire', 'Tierra', 'Tierra']
        };

        function generateAllCombinations() {
            const combinations = [];
            for (let i = 0; i < Math.pow(ELEMENTS.length, 4); i++) {
                const combo = [];
                let num = i;
                for (let j = 0; j < 4; j++) {
                    combo.push(ELEMENTS[num % ELEMENTS.length]);
                    num = Math.floor(num / ELEMENTS.length);
                }
                combinations.push(combo);
            }
            return combinations;
        }

        function toggleDropdown(position) {
            const selectors = document.querySelectorAll('.element-selector');
            const selector = selectors[position];
            
            let dropdown = selector.parentElement.querySelector('.dropdown-menu');
            if (!dropdown) {
                dropdown = document.createElement('div');
                dropdown.className = 'dropdown-menu';
                dropdown.innerHTML = ELEMENTS.map(el => 
                    `<div class="dropdown-item ${ELEMENT_CLASS[el].toLowerCase()}" onclick="selectElement(${position}, '${el}')">${el}</div>`
                ).join('');
                selector.parentElement.appendChild(dropdown);
            }
            
            dropdown.classList.toggle('active');
        }

        function selectElement(position, element) {
            solver.currentSelection[position] = element;
            updateSelectors();
            closeAllDropdowns();
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('active');
            });
        }

        function updateSelectors() {
            const selectors = document.querySelectorAll('.element-selector');
            selectors.forEach((sel, i) => {
                const element = solver.currentSelection[i];
                if (element) {
                    sel.textContent = element.substring(0, 4);
                    sel.className = `element-selector ${ELEMENT_CLASS[element].toLowerCase()}`;
                } else {
                    sel.textContent = '-';
                    sel.className = 'element-selector';
                }
            });
        }

        function cycleCircle(position) {
            const states = ['empty', 'white', 'black'];
            const currentIndex = states.indexOf(solver.currentFeedback[position]);
            const nextIndex = (currentIndex + 1) % states.length;
            solver.currentFeedback[position] = states[nextIndex];
            updateCircles();
        }

        function updateCircles() {
            const circles = document.querySelectorAll('.circle-btn');
            circles.forEach((circle, i) => {
                circle.className = `circle-btn ${solver.currentFeedback[i]}`;
                if (solver.currentFeedback[i] === 'white') {
                    circle.textContent = '⚪';
                } else if (solver.currentFeedback[i] === 'black') {
                    circle.textContent = '⚫';
                } else {
                    circle.textContent = '';
                }
            });
        }

        function useSuggestion() {
            solver.currentSelection = [...solver.currentSuggestion];
            solver.currentFeedback = ['empty', 'empty', 'empty', 'empty'];
            updateSelectors();
            updateCircles();
            showStatus('Usa esta combinación en el juego', 'info');
        }

        function calculateFeedback(guess, secret) {
            let whiteCircles = 0;
            let blackCircles = 0;

            const secretRemaining = [];
            const guessRemaining = [];

            for (let i = 0; i < guess.length; i++) {
                if (guess[i] === secret[i]) {
                    whiteCircles++;
                } else {
                    secretRemaining.push(secret[i]);
                    guessRemaining.push(guess[i]);
                }
            }

            for (let element of guessRemaining) {
                const index = secretRemaining.indexOf(element);
                if (index !== -1) {
                    blackCircles++;
                    secretRemaining.splice(index, 1);
                }
            }

            return { white: whiteCircles, black: blackCircles };
        }

        function submitFeedback() {
            if (solver.currentSelection.includes(null)) {
                showStatus('Selecciona los 4 elementos', 'error');
                return;
            }

            const whiteCount = solver.currentFeedback.filter(f => f === 'white').length;
            const blackCount = solver.currentFeedback.filter(f => f === 'black').length;

            solver.attempts.push([...solver.currentSelection]);
            solver.feedbackHistory.push({ white: whiteCount, black: blackCount });

            if (whiteCount === 4) {
                addToHistory(solver.currentSelection, whiteCount, blackCount, true);
                showStatus(`🎉 ¡CÓDIGO ENCONTRADO!`, 'success');
                return;
            }

            const newPossible = [];
            for (let combo of solver.possibleCombinations) {
                const feedback = calculateFeedback(solver.currentSelection, combo);
                if (feedback.white === whiteCount && feedback.black === blackCount) {
                    newPossible.push(combo);
                }
            }

            solver.possibleCombinations = newPossible;

            if (solver.possibleCombinations.length === 0) {
                showStatus('❌ Error en el feedback', 'error');
            } else {
                addToHistory(solver.currentSelection, whiteCount, blackCount);
                
                if (solver.possibleCombinations.length === 1) {
                    solver.currentSuggestion = solver.possibleCombinations[0];
                } else {
                    solver.currentSuggestion = getNextGuess();
                }
                
                updateSuggestion();
                clearForNextAttempt();
                updateStats();
                showStatus(`✓ ${solver.possibleCombinations.length} posibilidades restantes`, 'success');
            }
        }

        function getNextGuess() {
            let bestGuess = solver.possibleCombinations[0];
            let bestScore = Infinity;

            for (let guess of solver.possibleCombinations.slice(0, 30)) {
                const scores = {};

                for (let combo of solver.possibleCombinations) {
                    const feedback = calculateFeedback(guess, combo);
                    const key = `${feedback.white},${feedback.black}`;
                    scores[key] = (scores[key] || 0) + 1;
                }

                const maxScore = Math.max(...Object.values(scores));
                if (maxScore < bestScore) {
                    bestScore = maxScore;
                    bestGuess = guess;
                }
            }

            return bestGuess;
        }

        function updateSuggestion() {
            const suggestionCombo = document.getElementById('suggestionCombo');
            suggestionCombo.innerHTML = solver.currentSuggestion.map(el => 
                `<div class="suggestion-item ${ELEMENT_CLASS[el].toLowerCase()}">${el.substring(0, 4)}</div>`
            ).join('');
        }

        function clearForNextAttempt() {
            solver.currentSelection = [null, null, null, null];
            solver.currentFeedback = ['empty', 'empty', 'empty', 'empty'];
            updateSelectors();
            updateCircles();
        }

        function addToHistory(combo, white, black, isWin = false) {
            const history = document.getElementById('history');
            
            if (history.querySelector('.history-empty')) {
                history.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'history-item';
            item.textContent = `#${solver.attempts.length}: ${combo.join(' → ')} | ⚪${white} ⚫${black}${isWin ? ' ✓' : ''}`;
            history.appendChild(item);
            history.scrollTop = history.scrollHeight;
        }

        function updateStats() {
            document.getElementById('attemptCount').textContent = solver.attempts.length;
            document.getElementById('combinationCount').textContent = solver.possibleCombinations.length;
        }

        function showStatus(message, type) {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.className = `status-message ${type}`;
            setTimeout(() => {
                status.className = 'status-message';
            }, 3500);
        }

        function resetSolver() {
            solver = {
                possibleCombinations: generateAllCombinations(),
                attempts: [],
                feedbackHistory: [],
                currentSelection: [null, null, null, null],
                currentFeedback: ['empty', 'empty', 'empty', 'empty'],
                currentSuggestion: ['Aire', 'Aire', 'Tierra', 'Tierra']
            };

            document.getElementById('history').innerHTML = '<div class="history-empty">Sin intentos aún</div>';
            updateSelectors();
            updateCircles();
            updateSuggestion();
            updateStats();
            showStatus('✓ Reiniciado', 'info');
        }

        window.addEventListener('load', () => {
            updateSelectors();
            updateCircles();
            updateStats();
            showStatus('Usa la sugerencia o selecciona tus propios elementos', 'info');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.element-selector') && !e.target.closest('.dropdown-menu')) {
                closeAllDropdowns();
            }
        });
    </script>
</body>
</html>
