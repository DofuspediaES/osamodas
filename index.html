<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osamodas Solver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Osa Solver</h1>
        
        <!-- PARTE 1 -->
        <section id="part1">
            <p>Introduce cuántos hay de cada elemento (total 4):</p>
            <div class="input-grid">
                <div class="field">
                    <label>🪨 Tierra</label>
                    <input type="number" id="count-terra" value="0" min="0" max="4">
                </div>
                <div class="field">
                    <label>🔥 Fuego</label>
                    <input type="number" id="count-fire" value="0" min="0" max="4">
                </div>
                <div class="field">
                    <label>💧 Agua</label>
                    <input type="number" id="count-water" value="0" min="0" max="4">
                </div>
                <div class="field">
                    <label>💨 Aire</label>
                    <input type="number" id="count-air" value="0" min="0" max="4">
                </div>
            </div>
            <p id="error-msg" class="error"></p>
            <button id="btn-generate">GENERAR COMBINACIONES</button>
        </section>

        <!-- PARTE 2 -->
        <section id="part2" class="hidden">
            <div id="guess-area">
                <p>Prueba esta combinación:</p>
                <div id="current-guess" class="display-box"></div>
                
                <div class="feedback-row">
                    <div class="field">
                        <label>⚪ Blancos</label>
                        <input type="number" id="f-white" value="0" min="0" max="4">
                    </div>
                    <div class="field">
                        <label>⚫ Negros</label>
                        <input type="number" id="f-black" value="0" min="0" max="4">
                    </div>
                </div>
                <button id="btn-filter">FILTRAR RESULTADOS</button>
            </div>

            <div id="result-area" class="hidden">
                <h2 class="success">¡SOLUCIÓN!</h2>
                <div id="final-solution" class="display-box"></div>
                <button onclick="location.reload()">REINICIAR</button>
            </div>
            
            <p class="status">Restantes: <span id="count-rem">?</span></p>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
